name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  content:
    name: Content build and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content
      - name: Bundled content is in sync with content/
        run: git diff --exit-code -- ios/SystemDesignTrainer/Resources/content
      - run: npm test

  core:
    name: Core logic tests (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: ios/TrainerCore
