name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  content:
    name: Content build and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content
      - name: Bundled content is in sync with content/
        run: git diff --exit-code -- ios/SystemDesignTrainer/Resources/content
      - run: npm test

  core:
    name: Core logic tests (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: ios/TrainerCore

  app:
    name: iOS app build and simulator UI tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in sorted(d, reverse=True) if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone')))")
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Build and run UI tests
        working-directory: ios
        run: |
          xcodebuild test -project SystemDesignTrainer.xcodeproj -scheme SystemDesignTrainer \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" CODE_SIGNING_ALLOWED=NO
